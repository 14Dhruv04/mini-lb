services:
  minilb:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - ./minilb.cloud.yml:/etc/minilb/minilb.yml:ro
    depends_on:
      backend-a:
        condition: service_started
      backend-b:
        condition: service_started

  backend-a:
    build:
      context: .
      dockerfile: demo-backend/Dockerfile
    command: ["backend-a", "8001"]
    expose:
      - "8001"

  backend-b:
    build:
      context: .
      dockerfile: demo-backend/Dockerfile
    command: ["backend-b", "8002"]
    expose:
      - "8002"
